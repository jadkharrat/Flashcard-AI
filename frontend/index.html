<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1b2135" />
    <meta name="description" content="Turn PDF study material into concise, AI-generated flashcards." />
    <script>
      try {
        const savedTheme = localStorage.getItem("theme");
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        const hasSavedTheme = savedTheme === "dark" || savedTheme === "light";
        if (savedTheme === "dark" || (!hasSavedTheme && prefersDark)) {
          document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = "dark";
        }
      } catch (_) {
        // The app applies the system theme after loading if storage is unavailable.
      }
    </script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%236658d3'/%3E%3Cpath d='M9 7h12.5A3.5 3.5 0 0 1 25 10.5V24H12.5A3.5 3.5 0 0 1 9 20.5V7Z' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E" />
    <title>RecallAI — PDF to Flashcards</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
